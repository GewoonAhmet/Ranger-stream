<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nuvio - Streaming Hub</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root { --accent: #e50914; --bg-color: #0f1014; --card-bg: #1a1c23; --border-color: #2a2d3a; --text-color: #ffffff; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; min-height: 100vh; }
    .panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: #111; color: #fff; box-sizing: border-box; }
    button { padding: 10px 20px; background: var(--accent); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px; }
    
    .network-scroll { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
    .network-scroll::-webkit-scrollbar { display: none; }
    .network-btn { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 8px; padding: 15px 25px; min-width: 120px; text-align: center; cursor: pointer; font-weight: bold; color: #fff; display: flex; align-items: center; justify-content: center; }
    .network-btn.active { border-color: var(--accent); background: rgba(229, 9, 20, 0.1); }
    
    .filter-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--card-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); flex-wrap: wrap; gap: 10px; }
    .type-toggles { display: flex; gap: 5px; }
    .type-toggles button { background: transparent; border: 1px solid var(--border-color); color: #aaa; padding: 8px 16px; width: auto; margin: 0; }
    .type-toggles button.active { background: #333; color: #fff; border-color: #555; }
    
    .search-bar { display: flex; gap: 10px; flex-grow: 1; max-width: 300px; }
    .search-bar input { margin-bottom: 0; padding: 8px; }
    .search-bar button { width: auto; margin: 0; padding: 8px 15px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
    .card { background: var(--card-bg); border-radius: 8px; overflow: hidden; cursor: pointer; border: 1px solid var(--border-color); transition: 0.2s; }
    .card:hover { border-color: var(--accent); transform: translateY(-3px); }
    .card img { width: 100%; height: 210px; object-fit: cover; }
    .card-body { padding: 10px; font-size: 12px; }
    
    .status-text { font-size: 12px; color: #aaa; margin: 10px 0; }
    h1 { color: var(--accent); margin: 0 0 20px 0; }
    #appContent { display: none; }
    #loginPanel { max-width: 400px; margin: 50px auto; }
  </style>
</head>
<body>

  <div id="loginPanel" class="panel">
    <h1>Nuvio Login</h1>
    <input type="email" id="email" placeholder="E-mailadres">
    <input type="password" id="password" placeholder="Wachtwoord">
    <button id="btnLogin">Inloggen</button>
    <button id="btnReg" style="background: #333;">Account Aanmaken</button>
    <div id="authStatus" class="status-text"></div>
  </div>

  <div id="appContent">
    <div class="panel">
      <h1 id="userGreeting" style="margin-bottom:10px;">Nuvio</h1>
      <input type="password" id="rdToken" placeholder="Real-Debrid API Token" style="max-width:300px;">
      <button id="btnSaveToken" style="max-width:150px;">Token Opslaan</button>
    </div>

    <div class="network-scroll" id="networkContainer">
      <div class="network-btn active" onclick="setNetwork(8, this)">Netflix</div>
      <div class="network-btn" onclick="setNetwork(337, this)">Disney+</div>
      <div class="network-btn" onclick="setNetwork(384, this)">HBO Max</div>
      <div class="network-btn" onclick="setNetwork(531, this)">Paramount+</div>
      <div class="network-btn" onclick="setNetwork(9, this)">Prime Video</div>
    </div>

    <div class="filter-row">
      <div class="type-toggles">
        <button class="active" id="btnMovie" onclick="setType('movie')">Films</button>
        <button id="btnTv" onclick="setType('tv')">Series</button>
      </div>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Zoek in collectie...">
        <button onclick="executeSearch()">Zoek</button>
      </div>
    </div>

    <div id="actionStatus" class="status-text">Catalogus laden...</div>
    <div id="grid" class="grid"></div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } 
    from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBl6QqV0S0WahW2YrnjgTd56jHfg2w5arI",
      authDomain: "streamhub-58d45.firebaseapp.com",
      projectId: "streamhub-58d45",
      storageBucket: "streamhub-58d45.firebasestorage.app",
      messagingSenderId: "49615308081",
      appId: "1:49615308081:web:da2fac1d841239d34f5c10"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const TMDB_TOKEN = "eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJiMzJhZTJhODg5MTU4OTY3YWUxZjBhNjc4Mzg4YWFiOSIsInN1YiI6IjY1ZGFkMGY3OWM3MmM3MDE4NjhlMjAyYiIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.v4sU62Xb3fXN_T5A_I4QG6C9Fm2E8E_6G2M8F";

    let currentNetwork = 8;
    let currentType = 'movie';

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('loginPanel').style.display = 'none';
        document.getElementById('appContent').style.display = 'block';
        document.getElementById('userGreeting').innerText = `Welkom, ${user.email.split('@')[0]}`;
        const savedToken = localStorage.getItem('rdToken');
        if (savedToken) document.getElementById('rdToken').value = savedToken;
        loadCatalog();
      } else {
        document.getElementById('loginPanel').style.display = 'block';
        document.getElementById('appContent').style.display = 'none';
      }
    });

    document.getElementById('btnReg').onclick = () => {
      createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
        .catch(err => document.getElementById('authStatus').innerText = err.message);
    };
    document.getElementById('btnLogin').onclick = () => {
      signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
        .catch(err => document.getElementById('authStatus').innerText = 'Inloggen mislukt.');
    };
    document.getElementById('btnSaveToken').onclick = () => {
      localStorage.setItem('rdToken', document.getElementById('rdToken').value);
      alert('Real-Debrid token opgeslagen.');
    };

    window.setNetwork = (id, element) => {
      currentNetwork = id;
      document.querySelectorAll('.network-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      document.getElementById('searchInput').value = '';
      loadCatalog();
    };

    window.setType = (type) => {
      currentType = type;
      document.getElementById('btnMovie').classList.toggle('active', type === 'movie');
      document.getElementById('btnTv').classList.toggle('active', type === 'tv');
      document.getElementById('searchInput').value = '';
      loadCatalog();
    };

    window.executeSearch = () => {
      const query = document.getElementById('searchInput').value;
      if (!query) return loadCatalog();
      document.getElementById('actionStatus').innerText = 'Zoeken...';
      fetch(`https://api.themoviedb.org/3/search/${currentType}?query=${encodeURIComponent(query)}&language=nl-NL`, {
        headers: { Authorization: `Bearer ${TMDB_TOKEN}` }
      })
      .then(res => res.json())
      .then(data => renderGrid(data.results))
      .catch(() => document.getElementById('actionStatus').innerText = 'Zoekfout.');
    };

    function loadCatalog() {
      document.getElementById('actionStatus').innerText = 'Catalogus ophalen...';
      const url = `https://api.themoviedb.org/3/discover/${currentType}?language=nl-NL&sort_by=popularity.desc&watch_region=NL&with_watch_providers=${currentNetwork}`;
      
      fetch(url, { headers: { Authorization: `Bearer ${TMDB_TOKEN}` } })
        .then(res => res.json())
        .then(data => renderGrid(data.results))
        .catch(() => document.getElementById('actionStatus').innerText = 'Fout bij laden.');
    }

    function renderGrid(items) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      
      if (!items || items.length === 0) {
        document.getElementById('actionStatus').innerText = 'Geen titels gevonden.';
        return;
      }

      document.getElementById('actionStatus').innerText = `${items.length} titels geladen.`;

      items.forEach(item => {
        const title = item.title || item.name;
        const year = (item.release_date || item.first_air_date || '').substring(0, 4);
        const poster = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : 'https://via.placeholder.com/140x210?text=Geen+Afbeelding';
        
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${poster}" alt="${title}">
          <div class="card-body">
            <b>${title}</b>
            <div style="color:#aaa; margin-top:4px;">${year}</div>
          </div>
        `;
        card.onclick = () => alert(`Geselecteerd: ${title}`);
        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
