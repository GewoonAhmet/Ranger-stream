<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranger Stream</title>
    <style>
        body { background: #0b0b0b; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .hidden { display: none !important; }
        #auth-container { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .auth-box { background: #141414; padding: 40px; border-radius: 8px; width: 350px; border: 1px solid #333; }
        .auth-box h2 { color: #e50914; margin-bottom: 20px; }
        .auth-box input { width: 100%; padding: 10px; margin-bottom: 15px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        .auth-box button { width: 100%; padding: 10px; background: #e50914; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        
        #app-container { padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 15px; margin-bottom: 20px; }
        .nav-tabs, .sub-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .nav-tabs button, .sub-tabs button { background: #1f1f1f; color: #fff; border: 1px solid #333; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .nav-tabs button.active, .sub-tabs button.active { background: #e50914; border-color: #e50914; }
        
        #catalog-container { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .movie-card { width: 150px; cursor: pointer; background: #1f1f1f; border-radius: 6px; overflow: hidden; transition: transform 0.2s; }
        .movie-card:hover { transform: scale(1.05); }
        .movie-card img { width: 100%; height: 225px; object-fit: cover; }
        .movie-card .title { padding: 10px; font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Modals */
        .modal-overlay { display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .modal-content { background: #141414; padding: 30px; border-radius: 8px; width: 500px; max-width: 100%; color: #fff; border: 1px solid #333; max-height: 90vh; overflow-y: auto; }
        .modal-content input, .modal-content select { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        
        .cast-list { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-top: 10px; }
        .cast-member { text-align: center; font-size: 11px; width: 70px; flex-shrink: 0; }
        .cast-member img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-bottom: 5px; }
    </style>
</head>
<body>

    <!-- Inlog / Registratie Scherm -->
    <div id="auth-container">
        <div class="auth-box">
            <h2>Ranger Login</h2>
            <input type="email" id="auth-email" placeholder="E-mailadres">
            <input type="password" id="auth-password" placeholder="Wachtwoord">
            <button id="btn-login">Inloggen</button>
            <button id="btn-signup" style="background: #333;">Account Aanmaken</button>
            <p id="auth-error" style="color: #e50914; font-size: 13px;"></p>
        </div>
    </div>

    <!-- Hoofdapplicatie -->
    <div id="app-container" class="hidden">
        <header>
            <h1 id="welcome-user" style="color: #e50914; margin:0;">Welkom</h1>
            <button id="open-settings" style="background: #333; color: #fff; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px;">Instellingen</button>
        </header>

        <!-- Streamingdiensten Knoppen -->
        <div class="nav-tabs" id="provider-tabs">
            <button class="active" data-provider="8">Netflix</button>
            <button data-provider="337">Disney+</button>
            <button data-provider="1899">HBO Max</button>
            <button data-provider="119">Prime Video</button>
        </div>

        <!-- Films / Series Schakelaar -->
        <div class="sub-tabs" id="type-tabs">
            <button class="active" data-type="movie">Films</button>
            <button data-type="tv">Series</button>
        </div>

        <div id="catalog-container">
            <p style="color: #888;">Vul je TMDB API-sleutel in bij de instellingen om de catalogus te laden.</p>
        </div>
    </div>

    <!-- Detail Modal (Voor Films/Series Info) -->
    <div id="detail-modal" class="modal-overlay">
        <div class="modal-content" style="width: 700px;">
            <h2 id="detail-title" style="margin-top:0; color:#e50914;"></h2>
            <p id="detail-meta" style="color: #aaa; font-size: 13px;"></p>
            <p id="detail-overview" style="line-height: 1.5; font-size: 14px;"></p>
            
            <div id="trailer-container" style="margin: 15px 0;"></div>

            <h3 style="font-size: 15px; margin-bottom: 5px;">Hoofdrolspelers</h3>
            <div class="cast-list" id="detail-cast"></div>

            <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
                <button id="close-detail" style="background: #444; color:#fff; border:none; padding: 8px 15px; border-radius: 4px; cursor:pointer;">Sluiten</button>
            </div>
        </div>
    </div>

    <!-- Instellingen Modal -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Cloud Instellingen</h3>
            <label>Real-Debrid Token</label>
            <input type="text" id="setting-debrid-token">

            <label>TMDB API Sleutel (voor catalogus)</label>
            <input type="text" id="setting-tmdb-key">

            <label>Ondertiteling Taal</label>
            <select id="setting-sub-lang">
                <option value="nl">Nederlands</option>
                <option value="en">Engels</option>
            </select>

            <label>Ondertiteling Grootte (px)</label>
            <input type="number" id="setting-sub-size" value="20">

            <label>Ondertiteling Kleur</label>
            <input type="color" id="setting-sub-color" value="#ffffff">

            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
                <button id="close-settings" style="background: #444; width: auto; padding: 8px 15px;">Sluiten</button>
                <button id="save-settings" style="background: #e50914; width: auto; padding: 8px 15px;">Opslaan in Account</button>
            </div>
        </div>
    </div>

    <!-- Firebase & App Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBl6QqV0S0WahW2YrnjgTd56jHfg2w5arI",
            authDomain: "streamhub-58d45.firebaseapp.com",
            projectId: "streamhub-58d45",
            storageBucket: "streamhub-58d45.appspot.com",
            messagingSenderId: "49615308081",
            appId: "1:49615308081:web:da2fac1d841239d34f5c10"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let selectedProvider = "8"; 
        let selectedType = "movie";  

        // Auth acties
        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) {
                document.getElementById('auth-error').innerText = err.message;
            }
        });

        document.getElementById('btn-signup').addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            try {
                await createUserWithEmailAndPassword(auth, email, pass);
            } catch (err) {
                document.getElementById('auth-error').innerText = err.message;
            }
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                document.getElementById('welcome-user').innerText = `Welkom, ${user.email.split('@')[0]}`;
                await loadUserSettings(user.uid);
            } else {
                currentUser = null;
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('app-container').classList.add('hidden');
            }
        });

        // Modals besturing
        const settingsModal = document.getElementById('settings-modal');
        document.getElementById('open-settings').addEventListener('click', () => settingsModal.style.display = 'flex');
        document.getElementById('close-settings').addEventListener('click', () => settingsModal.style.display = 'none');

        const detailModal = document.getElementById('detail-modal');
        document.getElementById('close-detail').addEventListener('click', () => detailModal.style.display = 'none');

        // Instellingen opslaan in Firestore
        document.getElementById('save-settings').addEventListener('click', async () => {
            if (!currentUser) return;
            const settings = {
                debridToken: document.getElementById('setting-debrid-token').value,
                tmdbKey: document.getElementById('setting-tmdb-key').value,
                subLang: document.getElementById('setting-sub-lang').value,
                subSize: document.getElementById('setting-sub-size').value,
                subColor: document.getElementById('setting-sub-color').value
            };

            try {
                await setDoc(doc(db, "users", currentUser.uid), settings, { merge: true });
                settingsModal.style.display = 'none';
                alert('Instellingen opgeslagen in je account.');
                if (settings.tmdbKey) fetchCatalog();
            } catch (err) {
                console.error("Opslaan mislukt:", err);
            }
        });

        async function loadUserSettings(uid) {
            try {
                const docSnap = await getDoc(doc(db, "users", uid));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('setting-debrid-token').value = data.debridToken || '';
                    document.getElementById('setting-tmdb-key').value = data.tmdbKey || '';
                    document.getElementById('setting-sub-lang').value = data.subLang || 'nl';
                    document.getElementById('setting-sub-size').value = data.subSize || '20';
                    document.getElementById('setting-sub-color').value = data.subColor || '#ffffff';

                    if (data.tmdbKey) fetchCatalog();
                }
            } catch (err) {
                console.error("Laden mislukt:", err);
            }
        }

        document.querySelectorAll('#provider-tabs button').forEach(button => {
            button.addEventListener('click', (e) => {
                document.querySelectorAll('#provider-tabs button').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                selectedProvider = e.target.getAttribute('data-provider');
                fetchCatalog();
            });
        });

        document.querySelectorAll('#type-tabs button').forEach(button => {
            button.addEventListener('click', (e) => {
                document.querySelectorAll('#type-tabs button').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                selectedType = e.target.getAttribute('data-type');
                fetchCatalog();
            });
        });

        window.fetchCatalog = async function() {
            const apiKey = document.getElementById('setting-tmdb-key').value;
            const container = document.getElementById('catalog-container');
            
            if (!apiKey) {
                container.innerHTML = '<p style="color: #aaa;">Vul je TMDB API-sleutel in bij de instellingen.</p>';
                return;
            }

            container.innerHTML = '<p style="color:#aaa;">Catalogus laden...</p>';
            try {
                const url = `https://api.themoviedb.org/3/discover/${selectedType}?api_key=${apiKey}&with_watch_providers=${selectedProvider}&watch_region=NL&language=nl-NL`;
                const res = await fetch(url);
                const data = await res.json();
                
                if (data.results && data.results.length > 0) {
                    container.innerHTML = '';
                    data.results.forEach(item => {
                        const title = item.title || item.name;
                        const poster = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : 'https://via.placeholder.com/500x750?text=Geen+Poster';
                        
                        const card = document.createElement('div');
                        card.className = 'movie-card';
                        card.innerHTML = `
                            <img src="${poster}">
                            <div class="title">${title}</div>
                        `;
                        card.addEventListener('click', () => openDetailView(item.id, selectedType, apiKey));
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<p style="color:#aaa;">Geen titels gevonden voor deze selectie.</p>';
                }
            } catch (err) {
                container.innerHTML = '<p style="color:red;">Fout bij ophalen TMDB data.</p>';
            }
        };

        // Gedetailleerde info ophalen inclusief cast en trailers
        async function openDetailView(id, type, apiKey) {
            detailModal.style.display = 'flex';
            document.getElementById('detail-title').innerText = 'Laden...';
            document.getElementById('detail-meta').innerText = '';
            document.getElementById('detail-overview').innerText = '';
            document.getElementById('trailer-container').innerHTML = '';
            document.getElementById('detail-cast').innerHTML = '';

            try {
                // Info + Credits + Videos ophalen in één keer via append_to_response
                const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${apiKey}&language=nl-NL&append_to_response=credits,videos`);
                const data = await res.json();

                document.getElementById('detail-title').innerText = data.title || data.name;
                
                const year = (data.release_date || data.first_air_date || '').split('-')[0];
                const runtime = data.runtime ? `${data.runtime} min` : (data.episode_run_time?.[0] ? `${data.episode_run_time[0]} min / aflevering` : '');
                document.getElementById('detail-meta').innerText = `${year} • ${runtime}`;
                document.getElementById('detail-overview').innerText = data.overview || 'Geen beschrijving beschikbaar.';

                // Zoek YouTube Trailer
                const trailer = data.videos?.results?.find(v => v.site === 'YouTube' && v.type === 'Trailer');
                if (trailer) {
                    document.getElementById('trailer-container').innerHTML = `
                        <iframe width="100%" height="280" src="https://www.youtube.com/embed/${trailer.key}" frameborder="0" allowfullscreen style="border-radius:6px;"></iframe>
                    `;
                }

                // Acteurs (Cast met foto's)
                const castContainer = document.getElementById('detail-cast');
                const castList = data.credits?.cast?.slice(0, 10) || [];
                if (castList.length > 0) {
                    castList.forEach(actor => {
                        const profileImg = actor.profile_path ? `https://image.tmdb.org/t/p/w185${actor.profile_path}` : 'https://via.placeholder.com/100?text=Geen+Foto';
                        const actorDiv = document.createElement('div');
                        actorDiv.className = 'cast-member';
                        actorDiv.innerHTML = `
                            <img src="${profileImg}">
                            <div style="font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${actor.name}</div>
                        `;
                        castContainer.appendChild(actorDiv);
                    });
                } else {
                    castContainer.innerHTML = '<p style="font-size:12px; color:#888;">Geen acteursinformatie beschikbaar.</p>';
                }

            } catch (err) {
                console.error("Fout bij ophalen details:", err);
            }
        }
    </script>
</body>
</html>
